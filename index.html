<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA-AGORA | Biblioteca de Conocimiento</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div id="agora-container">
        <header>
            <h1>IA-AGORA</h1>
            <p>SISTEMA DE RECUPERACIÓN DOCUMENTAL</p>
        </header>

        <div id="chat-box">
            <div class="message system">
                <strong>ÁGORA:</strong> Bienvenido, buscador. He indexado los manuscritos y documentos en mi base de datos. ¿Qué conocimiento deseas recuperar hoy?
            </div>
        </div>

        <form id="input-area">
            <input type="text" id="user-input" placeholder="Formula tu consulta sobre los documentos..." autocomplete="off" required>
            <button type="submit" id="send-btn">CONSULTAR</button>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
